# Layout of the heatmaps and PSTHs: the epochs of each row and their time bins.
# Which events they show: BehaviorScreen/filters.yaml.

# time bins can also be specified as [start, stop, step]
time_bins:
  - [0, 2.5]
  - [2.5, 5]
  - [5, 7.5]
  - [7.5, 10]
  - [10, 15]
  - [15, 25]

fine_time_bins: [0, 25, 0.2]

stimuli:
  - stim: DARK
    name: "dark"
    parameters: 
      - background_color: {'==': "[0.0, 0.0, 0.0, 1.0]"}
        epoch_name: {'==': "spontaneous dark"}

  - stim: BRIGHT
    name: "bright"
    parameters: 
      - foreground_color: {'==': "[0.2, 0.2, 0.0, 1.0]"}
        epoch_name: {'==': "spontaneous bright"}

  - stim: PREY_CAPTURE
    name: "prey"
    parameters: 
      - epoch_name: {'in': ["prey capture right", "prey capture left"]}
    fine_time_bins: [0, 25, 0.2]

  - stim: PHOTOTAXIS
    name: "dark | bright"
    parameters: 
       - epoch_name: {'in': ["phototaxis bright right", "phototaxis bright left"]}
         foreground_color: {'==': "[0.1, 0.1, 0.0, 1.0]"}
    time_bins:
      - [0, 0.5]
      - [0.5, 1]
      - [1, 1.5]
      - [1.5, 2]
      - [2, 5]
      - [5, 10]
      - [10, 15]
      - [15, 25]
    fine_time_bins: [0, 25, 0.2]

  - stim: OMR
    name: "grating lateral"
    parameters: 
      - epoch_name: {'in': ["grating right", "grating left"]}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 7.5]
      - [7.5, 10]
    fine_time_bins: [0, 10, 0.2]

  - stim: OMR
    name: "grating forward"
    parameters: 
      - epoch_name: {'==': "grating forward"}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 7.5]
      - [7.5, 10]
    fine_time_bins: [0, 10, 0.2]

  - stim: OKR
    name: "pinwheel"
    parameters: 
      - epoch_name: {'in': ["pinwheel clockwise", "pinwheel counter-clockwise"]}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 7.5]
      - [7.5, 10]
    fine_time_bins: [0, 10, 0.2]

  - stim: LOOMING
    name: "looming"
    parameters:
      - epoch_name: {'in': ["looming left", "looming right"]}
    time_bins:
      - [0, 4]
      - [4, 6]
      - [6, 10]
    fine_time_bins: [0, 10, 0.2]

  - stim: BRIGHT
    name: "looming break"
    parameters:
      - epoch_name: {'in': ["looming break after left", "looming break after right"]}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 10]
      - [10, 20]
      - [20, 50]
    fine_time_bins: [0, 50, 0.4]

  - stim: DARK
    name: "bright -> dark"
    parameters: 
      - epoch_name: {'==': "flash dark"}
    time_bins:
      - [0, 0.5]
      - [0.5, 1]
      - [1, 2]
      - [2, 5]
    fine_time_bins: [0, 5, 0.2]

