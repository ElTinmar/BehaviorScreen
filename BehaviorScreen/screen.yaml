filters:
  distance_center: {'<=': 10} 
  proba: {'>=': 0.5}
  distance: {'<=': 100}
  peak_axial_speed: {'<=': 300}
  heading_mismatch_max: {'<=': 180} # this might inadvertently remove O-bends
  centroid_mismatch_max: {'<=': 1000} # this might inadvertently remove O-bends
  file: {'not_in': [
    "02_07dpf_GR_Wed_18_Mar_2026_15h30min46sec_fish_1", # went out of arena
    "02_07dpf_GR_Wed_18_Mar_2026_15h30min46sec_fish_3"  # went out of arena
  ]}

time_bins:
  - [0, 2.5]
  - [2.5, 5]
  - [5, 7.5]
  - [7.5, 10]
  - [10, 15]
  - [15, 25]

stimuli:
  - stim: DARK
    name: "dark"
    parameters: 
      - background_color: {'==': "[0.0, 0.0, 0.0, 1.0]"}
        epoch_name: {'==': "spontaneous dark"}

  - stim: BRIGHT
    name: "bright"
    parameters: 
      - foreground_color: {'==': "[0.2, 0.2, 0.0, 1.0]"}
        epoch_name: {'==': "spontaneous bright"}

  - stim: PREY_CAPTURE
    name: "prey"
    parameters: 
      - epoch_name: {'in': ["prey capture right", "prey capture left"]}

  - stim: PHOTOTAXIS
    name: "dark | bright"
    parameters: 
       - epoch_name: {'in': ["phototaxis bright right", "phototaxis bright left"]}
         foreground_color: {'==': "[0.1, 0.1, 0.0, 1.0]"}
    time_bins:
      - [0, 0.5]
      - [0.5, 1]
      - [1, 1.5]
      - [1.5, 2]
      - [2, 5]
      - [5, 10]
      - [10, 15]
      - [15, 25]

  - stim: OMR
    name: "grating lateral"
    parameters: 
      - epoch_name: {'in': ["grating right", "grating left"]}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 7.5]
      - [7.5, 10]

  - stim: OMR
    name: "grating forward"
    parameters: 
      - epoch_name: {'==': "grating forward"}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 7.5]
      - [7.5, 10]

  - stim: OKR
    name: "pinwheel"
    parameters: 
      - epoch_name: {'in': ["pinwheel clockwise", "pinwheel counter-clockwise"]}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 7.5]
      - [7.5, 10]

  - stim: LOOMING
    name: "looming"
    parameters:
      - epoch_name: {'in': ["looming left", "looming right"]}
    time_bins:
      - [0, 4]
      - [4, 6]
      - [6, 10]

  - stim: BRIGHT
    name: "looming break"
    parameters:
      - epoch_name: {'in': ["looming break after left", "looming break after right"]}
    time_bins:
      - [0, 2.5]
      - [2.5, 5]
      - [5, 10]
      - [10, 20]
      - [20, 50]

  - stim: DARK
    name: "bright -> dark"
    parameters: 
      - epoch_name: {'==': "flash dark"}
    time_bins:
      - [0, 0.5]
      - [0.5, 1]
      - [1, 2]
      - [2, 5]

