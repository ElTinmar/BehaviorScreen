# Events kept for analysis, by the models and the plots alike, in the rule syntax of filters.py.

bout:
  distance_center: {"<=": 10}
  centroid_mismatch_max: {"<=": 1000}  # this might inadvertently remove O-bends
  # proba: {">=": 0.5}
  distance: {"<=": 100}
  peak_axial_speed: {"<=": 300}
